<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar código</title>
    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="/frontend/css/auth.css">
</head>

<body class="d-flex justify-content-center align-items-center">

    <form id="codigoForm" class="w-100 h-100 d-flex justify-content-center align-items-center">

        <!-- Container -->
        <div class="container black_card d-flex flex-column align-items-center p-5 mb-5"
            style="max-width: 500px; min-height: 400px;">

            <!-- Titulos -->
            <div class="d-flex flex-column align-items-center">
                <h1 class="white_title">Confirmar email</h1>
                <p style="color: #ab5eff;">Digite o código enviado no email</p>
            </div>

            <!-- Inputs do código-->
            <div class="w-100 d-flex flex-column px-4 mt-auto mb-auto">

                <div class="row gap-2">
                    <!-- Input 1 -->
                    <div class="col input-group">
                        <input id="codigo1" class="form-control input_escuro p-3 text-center fs-3" placeholder=""
                            aria-describedby="visible-addon">
                    </div>

                    <!-- Input 2 -->
                    <div class="col input-group">
                        <input id="codigo2" class="form-control input_escuro p-3 text-center fs-3" placeholder=""
                            aria-describedby="visible-addon">
                    </div>

                    <!-- Input 3 -->
                    <div class="col input-group">
                        <input id="codigo3" class="form-control input_escuro p-3 text-center fs-3" placeholder=""
                            aria-describedby="visible-addon">
                    </div>

                    <!-- Input 4 -->
                    <div class="col input-group">
                        <input id="codigo4" class="form-control input_escuro p-3 text-center fs-3" placeholder=""
                            aria-describedby="visible-addon">
                    </div>
                </div>

            </div>


            <!-- botões -->
            <div class="d-flex flex-column gap-2 w-75 mt-auto ">

                <!-- Logar -->
                <button type="submit" class="btn btn-secondary w-100 btn_roxo">Confirmar</button>


                <!-- Links -->
                <div class="d-flex justify-content-center gap-2">
                    <p class="link" style="text-decoration: none;">Não recebeu o email?</p>

                    <a href="#" class="link_rosa">reenviar-me</a>

                    <a href="#" class="link_rosa">Suporte</a>
                </div>
            </div>
        </div>
    </form>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Seu JS -->
    <script src="/frontend/ajax/verifica_email_ajax.js"></script>
</body>

</html>
