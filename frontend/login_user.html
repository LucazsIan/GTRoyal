<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="/frontend/css/style.css">
</head>

<body class="d-flex justify-content-center align-items-center">

    <form id="loginForm" class="w-100 h-100 d-flex justify-content-center align-items-center">

        <!-- Container -->
        <div class="container black_card d-flex flex-column align-items-center justify-content-center py-5 mb-5"
            style="max-width: 390px; max-height: 600px;">

            <!-- Titulos -->
            <div class="d-flex flex-column align-items-center">
                <h1 class="white_title">LOGIN</h1>
                <p style="color: #ab5eff;">Bem-vindo ao GTRoyal</p>
            </div>

            <!-- Inputs -->
            <div class="w-100 d-flex flex-column px-4">

                <div class="d-flex flex-column gap-3">

                    <!-- E-MAIL input -->
                    <div>
                        <label class="text-white mb-1" for="email">E-mail</label>
                        <div class="input-group">
                            <input type="email" id="email" name="email" class="form-control input_escuro"
                                placeholder="Digite seu e-mail" aria-label="E-mail" aria-describedby="visible-addon">
                        </div>
                    </div>

                    <!-- SENHA input -->
                    <div>
                        <label class="text-white mb-1" for="password">Senha</label>
                        <div class="input-group">
                            <input type="password" id="password" name="password" class="form-control input_escuro"
                                placeholder="Digite sua senha" aria-label="Senha" aria-describedby="visible-addon">
                        </div>
                    </div>

                </div>

                <!-- Complementos -->
                <div class="d-flex justify-content-between w-100 pe-1 mt-1">

                    <!-- Lembrar-me -->
                    <div class="form-check d-flex align-items-start gap-1">
                        <input class="form-check-input input_escuro link ps-0 mt-1" style="border: 1px solid #741ec3;"
                            type="checkbox" value="" id="lembrar-me_check">
                        <label class="form-check-label text-white small link" style="text-decoration: none;"
                            for="lembrar-me_check">
                            Lembrar-me
                        </label>
                    </div>

                    <!-- Esqueci minha senha -->
                    <div class="">
                        <a href="#" class="link">
                            <p class="link_rosa me-1" >Esqueci minha senha</p>
                        </a>
                    </div>
                </div>

            </div>

            <!-- botões -->
            <div class="d-flex flex-column gap-2 w-75 mt-4 ">

                <!-- Logar -->
                <button type="submit" class="btn btn-secondary w-100 btn_roxo" id="login">Confirmar</button>

                <!-- Links -->
                <div class="d-flex justify-content-center gap-2">
                    <p class="link" style="text-decoration: none;">Novo aqui?</p>

                    <a href="#" class="link_rosa">Cadastrar</a>

                    <a href="#" class="link_rosa">Suporte</a>
                </div>
            </div>
        </div>
    </form>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Seu JS -->
    <script src="/frontend/ajax/login_ajax.js"></script>
</body>

</html>
