<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datatable</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

    <!-- head -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" />

    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
    <script src="/frontend/ajax/datatable_carros_ajax.js"></script>
</head>

<body>
    <div class="row">
        <div class="col-lg-11 col-md-11 col-sm-12 mb-2">
            <table style="width: 100%" id="tabela_carros"
                class="table table-striped table-hover table-bordered text-center align-middle rounded mx-auto">
                <thead class="table-light">
                    <tr>
                        <th style="color: #8205ff">Id</th>
                        <th style="color: #8205ff">Id do dono</th>
                        <th style="color: #8205ff">Marca</th>
                        <th style="color: #8205ff">Modelo</th>
                        <th style="color: #8205ff">Ano de fabricação</th>
                        <th style="color: #8205ff">Cor</th>
                        <th style="color: #8205ff">Carroceria</th>
                        <th style="color: #8205ff">Combustivel</th>
                        <th style="color: #8205ff">Quilometragem</th>
                        <th style="color: #8205ff">Preço</th>
                        <th style="color: #8205ff">Status</th>
                        <th style="color: #8205ff">Ações</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</body>

</html>
