<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datatable</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

    <!-- head -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" />

    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
    <script src="ajax/datatable_carros_ajax.js"></script>

    <style>
        /* Fundo geral */
        body {
            background-color: #0a0a0f;
            color: #d0b8ff;
            /* lilás claro */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Container principal */
        .container {
            max-width: 1200px;
        }

        /* Botões */
        .btn-outline-secondary {
            color: #9f7fff;
            border-color: #9f7fff;
            transition: all 0.3s ease;
        }

        .btn-outline-secondary:hover,
        .btn-outline-secondary:focus {
            background-color: #9f7fff;
            color: #0a0a0f;
            border-color: #9f7fff;
            box-shadow: 0 0 8px #bbaaff88;
        }

        .add-car {
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        #pdf {
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        /* Tabela */
        table.dataTable {
            border-collapse: separate !important;
            border-spacing: 0 10px !important;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(159, 127, 255, 0.3);
        }

        /* Cabeçalho da tabela */
        thead tr {
            background-color: #3a0ca3;
            color: #e0d7ff !important;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.03em;
        }

        /* Células */
        tbody td {
            background-color: #1a1a2e;
            color: #c6b9ff;
            border-bottom: 6px solid transparent;
            transition: background-color 0.3s ease;
        }

        tbody tr:hover td {
            background-color: #331a7a;
            color: #fff;
            cursor: pointer;
        }

        /* Bordas */
        table.dataTable tbody tr {
            border-radius: 10px;
            margin-bottom: 8px;
            box-shadow: 0 1px 5px rgba(159, 127, 255, 0.3);
        }

        /* Coluna de ações */
        .btn-sm {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 5px;
        }

        .btn-warning {
            background-color: #7e57c2;
            border-color: #7e57c2;
            color: #fff;
            transition: background-color 0.3s ease;
        }

        .btn-warning:hover {
            background-color: #9575cd;
            border-color: #9575cd;
            color: #fff;
            box-shadow: 0 0 8px #bbaaffaa;
        }

        .btn-danger {
            background-color: #6a1b9a;
            border-color: #6a1b9a;
            color: #fff;
            transition: background-color 0.3s ease;
        }

        .btn-danger:hover {
            background-color: #8e24aa;
            border-color: #8e24aa;
            color: #fff;
            box-shadow: 0 0 8px #bb55ffcc;
        }

        /* Estilo para o título da tabela */
        th {
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Pagination e controles do DataTable */
        .dataTables_wrapper .dataTables_paginate .paginate_button {
            color: #a085ff !important;
            background: transparent !important;
            border: none !important;
            padding: 0.3em 0.8em !important;
            margin-left: 2px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button.current,
        .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
            background-color: #8a62ff !important;
            color: #fff !important;
            box-shadow: 0 0 8px #a085ffaa;
        }

        /* Search input */
        .dataTables_filter input {
            background-color: #1a1a2e;
            border: 1px solid #7a52ff;
            color: #c6b9ff;
            border-radius: 6px;
            padding: 4px 8px;
            transition: border-color 0.3s ease;
        }

        .dataTables_filter input:focus {
            outline: none;
            border-color: #b19eff;
            box-shadow: 0 0 8px #b19effaa;
            background-color: #2e2b4d;
            color: #eae6ff;
        }

        /* Remover foco azul padrão nos botões */
        button:focus {
            outline: none;
            box-shadow: 0 0 6px 2px #a085ff88;
        }

        /* Ajuste responsivo */
        @media (max-width: 768px) {
            .container {
                padding: 0 15px;
            }

            .btn {
                font-size: 0.9rem;
            }
        }
    </style>

</head>

<body>
    <div class="row">
        <div class="col-lg-11 col-md-11 col-sm-12 mb-2 d-flex flex-column justify-content-center container">

            <div class="row gap-2 p-3">
                <button type="button" class="col btn btn-outline-secondary my-3 add-car">Registrar novo carro</button>
                <button type="button" class="col btn btn-outline-secondary my-3" id="pdf">Baixar pdf</button>
            </div>

            <table style="width: 100%" id="tabela_carros"
                class="table table-striped table-hover table-bordered text-center align-middle rounded mx-auto">
                <thead class="table-light">
                    <tr>
                        <th>Id</th>
                        <th>Id do dono</th>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Ano de fabricação</th>
                        <th>Cor</th>
                        <th>Carroceria</th>
                        <th>Combustivel</th>
                        <th>Quilometragem</th>
                        <th>Preço</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

        </div>
    </div>
</body>

</html>
