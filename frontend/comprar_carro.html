<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comprar | GT Royal</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Seus CSS -->
    <link rel="stylesheet" href="css/inicial.css" />
    <link rel="stylesheet" href="css/auth.css" />
    
</head>

<body>

    <!-- Seção dos Carros -->
    <section class="cars-showcase mt-5 pt-4">
        <div class="container">
            <h2 class="text-center mb-5"
                style="color: var(--roxo-lilas); text-transform: uppercase; letter-spacing: 2px;">
                Todos os Carros Disponíveis
            </h2>

            <div class="row" id="carrosContainer">
                <!-- Os cards serão inseridos aqui via AJAX -->
            </div>
        </div>
    </section>


    <!-- Modal de Detalhes do Carro -->
    <!-- Modal -->
    <div class="modal fade" id="modalCarro" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content modal-carro-content">

                <div class="modal-header border-0">
                    <h3 class="modal-title fw-bold text-uppercase" id="carroTitulo"></h3>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <div class="row">

                        <!-- IMAGEM GRANDE -->
                        <div class="col-lg-6 text-center mb-4">
                            <div class="carro-img-container">
                                <img id="carroImg" class="img-fluid" alt="Carro">
                            </div>
                        </div>

                        <!-- INFORMAÇÕES -->
                        <div class="col-lg-6">

                            <div class="info-bloco mb-4">
                                <h5 class="titulo-bloco">Informações Gerais</h5>

                                <p><strong>Marca:</strong> <span id="carroMarca"></span></p>
                                <p><strong>Modelo:</strong> <span id="carroModelo"></span></p>
                                <p><strong>Cor:</strong> <span id="carroCor"></span></p>
                                <p><strong>Carroceria:</strong> <span id="carroCarroceria"></span></p>
                                <p><strong>Combustível:</strong> <span id="carroCombustivel"></span></p>
                            </div>

                            <div class="info-bloco mb-4">
                                <h5 class="titulo-bloco">Ficha Técnica</h5>

                                <p><strong>Ano de Fabricação:</strong> <span id="carroAno"></span></p>
                                <p><strong>Preço:</strong> <span id="carroPreco"></span></p>
                            </div>

                            <div class="text-end">
                                <button id="btnComprar" class="btn btn-roxo w-100 py-3 fw-semibold fs-5">
                                    Comprar Agora
                                </button>
                            </div>

                        </div>

                    </div>

                </div>

            </div>
        </div>
    </div>



    <script src="ajax/comprar_carro_ajax.js"></script>
</body>

</html>
