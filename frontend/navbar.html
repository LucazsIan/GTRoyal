<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Seus CSS -->
    <link rel="stylesheet" href="/frontend/css/auth.css" />
    <link rel="stylesheet" href="/frontend/css/navbar.css" />
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: transparent;">
        <div class="container-fluid px-5">

            <!-- Esquerda: logo -->
            <a class="navbar-brand d-flex align-items-center" href="#">
                <span class="logo-gt">GT</span><span class="logo-royal">ROYAL</span>
            </a>

            <!-- Hamburguer (direita no mobile) -->
            <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <i class="fas fa-bars" style="font-size:1.25rem; color: white;"></i>
            </button>

            <!-- Collapse -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="w-100 d-lg-flex justify-content-center align-items-center">
                    <!-- Menu central -->
                    <ul class="navbar-nav d-lg-flex flex-lg-row gap-lg-4 text-center mx-auto">
                        <li class="nav-item"><a class="nav-link text-white active" href="#">Home</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="#">Negócios</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="#">Planos</a></li>
                    </ul>

                    <!-- Login / Cadastro -->
                    <ul class="navbar-nav text-center mt-3 mt-lg-0">
                        <li class="nav-item"><a class="nav-link" style="color: #ab5eff; font-weight:bold"
                                href="#">Login</a></li>
                        <li class="nav-item"><a class="nav-link" style="color: #ab5eff; font-weight:bold"
                                href="#">Cadastro</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Bootstrap JS no final do body -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
