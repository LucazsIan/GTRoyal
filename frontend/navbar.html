<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GT Royal</title>

  <!-- Fontes e Ícones -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="css/navbar.css" />
</head>

<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark elegant-navbar sticky-top">
    <div class="container-fluid px-5">
      
      <!-- Logo -->
      <a class="navbar-brand d-flex align-items-center" href="#">
        <span class="logo-gt">GT</span><span class="logo-royal">ROYAL</span>
      </a>

      <!-- Toggle Mobile -->
      <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegação">
        <i class="fas fa-bars"></i>
      </button>

      <!-- Itens -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <div class="w-100 d-lg-flex justify-content-between align-items-center mt-3 mt-lg-0">
          
          <!-- Menu central -->
          <ul class="navbar-nav mx-auto gap-lg-4 text-center">
            <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Negócios</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Planos</a></li>
          </ul>

          <!-- Login / Cadastro -->
          <ul class="navbar-nav text-center d-flex gap-3 mt-3 mt-lg-0">
            <li class="nav-item"><a class="nav-link destaque" href="#">Login</a></li>
            <li class="nav-item"><a class="nav-link destaque" href="#">Cadastro</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
