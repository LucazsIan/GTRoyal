<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GT Royal | Carros</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Fontes e Ícones -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="css/negocios.css">
</head>

<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark elegant-navbar fixed-top shadow-sm">
    <div class="container-fluid px-5">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <span class="logo-gt">GT</span><span class="logo-royal">ROYAL</span>
      </a>

      <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegação">
        <i class="fas fa-bars"></i>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <div class="w-100 d-lg-flex justify-content-between align-items-center mt-3 mt-lg-0">
          <ul class="navbar-nav mx-auto gap-lg-4 text-center">
            <li class="nav-item"><a class="nav-link" href="#">Início</a></li>
            <li class="nav-item"><a class="nav-link active" href="#">Carros</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Planos</a></li>
          </ul>
          <ul class="navbar-nav text-center d-flex gap-3 mt-3 mt-lg-0">
            <li class="nav-item"><a class="nav-link destaque" href="#">Login</a></li>
            <li class="nav-item"><a class="nav-link destaque" href="#">Cadastro</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <!-- SEÇÃO PRINCIPAL -->
  <section class="carros-section">
    <div class="container-fluid mt-5 pt-5">
      <div class="row g-4">
        <div class="col-md-4">
          <div class="car-card">
            <img src="img/carro_1.jpg" class="car-img" alt="Carro 1">
            <div class="card-overlay">
              <h3>Comprar Agora</h3>
              <a href="#" class="btn-card">Explorar</a>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="car-card">
            <img src="img/carro_2.jpg" class="car-img" alt="Carro 2">
            <div class="card-overlay">
              <h3>Vender Meu Carro</h3>
              <a href="#" class="btn-card">Anunciar</a>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="car-card">
            <img src="img/carro_3.avif" class="car-img" alt="Carro 3">
            <div class="card-overlay">
              <h3>Trocar Veículo</h3>
              <a href="#" class="btn-card">Ver Opções</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer mt-auto">
    <div class="container text-center py-4">
      <div class="logo-gtroyal">GT <span class="text-white">ROYAL</span></div>
      <p class="footer-text mt-2">© 2025 GT Royal — Todos os direitos reservados</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
